name: validation

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.0
          cache: true
      - name: Verify module graph
        run: go mod verify
      - name: Test native control plane
        run: go test ./...
      - name: Vet native control plane
        run: go vet ./...
      - name: Check Go formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.0
          cache: true
      - name: Build native executable
        run: mkdir -p bin && go build -trimpath -o bin/route-steward ./cmd/route-steward
      - name: Secret and generated-file scan
        shell: pwsh
        run: ./scripts/Check-NoSecrets.ps1
      - name: Static safety and public-tree validation
        shell: pwsh
        run: ./scripts/Test-Templates.ps1
      - name: Product version behavior
        shell: pwsh
        run: ./tests/Test-Version.ps1
      - name: Compatibility machine surface
        shell: pwsh
        run: ./tests/Test-Agent.ps1
      - name: Bash syntax
        shell: bash
        run: find server -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        shell: bash
        run: shellcheck server/*.sh

  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.0
          cache: true
      - name: Full local validation
        shell: pwsh
        run: ./scripts/Validate-Local.ps1

  release-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.0
          cache: true
      - name: Build and verify all release archives
        shell: bash
        run: bash ./scripts/Build-ReleaseArtifacts.sh
      - name: Run the installed journey against the archived native binary
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/route-steward-release"
          tar -xzf "dist/route-steward_$(tr -d '\r\n' < version.txt)_linux_amd64.tar.gz" -C "$RUNNER_TEMP/route-steward-release"
          ROUTE_STEWARD_BINARY="$RUNNER_TEMP/route-steward-release/route-steward" go test ./tests/userjourney

  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install pinned Worker dependencies
        run: npm ci
      - name: Generate Cloudflare runtime types
        run: npm run types
      - name: Type check
        run: npm run typecheck
      - name: Cloudflare runtime tests
        run: npm test
      - name: Wrangler dry run
        run: npm run deploy:dry-run
      - name: Dependency audit
        run: npm audit --audit-level=low
