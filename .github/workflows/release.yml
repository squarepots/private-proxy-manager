name: Release

on:
  push:
    branches: [main]
    paths:
      - version.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish prepared version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$EVENT_SHA" ]]; then
            echo "Checkout does not match the workflow event SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$main_sha" != "$EVENT_SHA" ]]; then
            echo "The workflow event SHA is no longer the current main head; start a new release run." >&2
            exit 1
          fi

          version="$(tr -d '\r\n' < version.txt)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version.txt is not plain SemVer X.Y.Z: $version" >&2
            exit 1
          fi

          tag="v$version"
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$EVENT_SHA" ]]; then
              echo "$tag already points to a different source commit." >&2
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already published; nothing to do."
            else
              gh release create "$tag" --verify-tag --generate-notes --title "$tag"
            fi
            exit 0
          fi

          latest_version="$(git tag --list 'v[0-9]*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"

          if [[ -z "$latest_version" ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "The first release must be started manually after validation."
              exit 0
            fi
          else
            highest="$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -n 1)"
            if [[ "$highest" != "$version" || "$version" == "$latest_version" ]]; then
              echo "version.txt ($version) does not advance the latest release version ($latest_version)." >&2
              exit 1
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "$tag" "$EVENT_SHA"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --generate-notes --title "$tag"
