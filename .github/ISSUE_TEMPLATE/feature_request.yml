name: Feature request
description: Propose a focused product improvement
title: ""
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the user problem and the smallest useful change.
        Do not include real server addresses, hostnames, subscription URLs, tokens, SSH paths or keys, generated client payloads, recovery archives, or private state. Use synthetic values.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is blocked, and what decision or workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the desired behavior, how an agent would use it, and any compatibility or privacy impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
