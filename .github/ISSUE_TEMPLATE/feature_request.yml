name: Feature request
description: Propose a focused product improvement
title: ""
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem first. PPM intentionally does not include a hosted control plane, billing, traffic analytics, automatic cloud provisioning, or arbitrary protocol support without a concrete product need.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is blocked, and what decision or workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the smallest useful behavior and any compatibility or privacy impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
