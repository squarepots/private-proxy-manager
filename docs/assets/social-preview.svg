<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Route Steward product preview</title>
  <desc id="desc">Route Steward lets an AI agent set up and manage a private proxy on servers you control.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07161b"/>
      <stop offset="0.55" stop-color="#0a1d27"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1722"/>
      <stop offset="1" stop-color="#0c111a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1185" cy="26" r="280" fill="#0f766e" opacity="0.14"/>
  <circle cx="512" cy="675" r="310" fill="#2563eb" opacity="0.08"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(64 56)">
      <rect width="178" height="36" rx="18" fill="#0f766e" fill-opacity="0.27" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <text x="89" y="24" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="750" letter-spacing="1">NATIVE CLI + MCP</text>
    </g>
    <text x="64" y="158" fill="#f8fafc" font-size="58" font-weight="780">Route Steward</text>
    <text x="64" y="214" fill="#dbeafe" font-size="29" font-weight="630">Private proxies on your servers.</text>
    <text x="64" y="252" fill="#dbeafe" font-size="29" font-weight="630">Set up and manage with AI.</text>
    <g transform="translate(64 294)">
      <rect width="488" height="60" rx="14" fill="#070b14" stroke="#28435a"/>
      <text x="22" y="24" fill="#8ba8be" font-size="11" font-weight="700" letter-spacing="1.2">ONE BINARY</text>
      <text x="22" y="45" fill="#f0f6fc" font-size="16" font-weight="650">Linux · macOS · Windows</text>
      <text x="466" y="37" text-anchor="end" fill="#5eead4" font-size="14" font-weight="700">schema 1</text>
    </g>
    <g transform="translate(64 394)">
      <g>
        <circle cx="18" cy="18" r="17" fill="#0c3550" stroke="#38bdf8"/>
        <text x="18" y="23" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="750">1</text>
        <text x="47" y="16" fill="#f8fafc" font-size="16" font-weight="700">Set up a proxy</text>
        <text x="47" y="38" fill="#8ba8be" font-size="13">one server or relay</text>
      </g>
      <g transform="translate(250 0)">
        <circle cx="18" cy="18" r="17" fill="#0f3d38" stroke="#2dd4bf"/>
        <text x="18" y="23" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="750">2</text>
        <text x="47" y="16" fill="#f8fafc" font-size="16" font-weight="700">Check server state</text>
        <text x="47" y="38" fill="#8ba8be" font-size="13">audit and typed drift</text>
      </g>
      <g transform="translate(0 74)">
        <circle cx="18" cy="18" r="17" fill="#372154" stroke="#a78bfa"/>
        <text x="18" y="23" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="750">3</text>
        <text x="47" y="16" fill="#f8fafc" font-size="16" font-weight="700">Change servers</text>
        <text x="47" y="38" fill="#8ba8be" font-size="13">overlap-first workflow</text>
      </g>
      <g transform="translate(250 74)">
        <circle cx="18" cy="18" r="17" fill="#4a2d0b" stroke="#f59e0b"/>
        <text x="18" y="23" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="750">4</text>
        <text x="47" y="16" fill="#f8fafc" font-size="16" font-weight="700">Recover the setup</text>
        <text x="47" y="38" fill="#8ba8be" font-size="13">encrypted local backup</text>
      </g>
    </g>
    <text x="64" y="596" fill="#8ba8be" font-size="15">github.com/squarepots/route-steward</text>
    <g transform="translate(610 56)">
      <rect width="606" height="528" rx="26" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
      <text x="34" y="49" fill="#f8fafc" font-size="21" font-weight="750">From request to private proxy</text>
      <text x="572" y="48" text-anchor="end" fill="#7891a6" font-size="12">machine-readable result</text>
      <g transform="translate(34 73)">
        <rect width="538" height="60" rx="15" fill="#0c2640" stroke="#2563eb"/>
        <circle cx="30" cy="30" r="15" fill="#2563eb"/>
        <text x="30" y="35" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">AI</text>
        <text x="58" y="27" fill="#dbeafe" font-size="15" font-weight="650">“Set up a private proxy on my servers.”</text>
        <text x="58" y="46" fill="#7dd3fc" font-size="11">intent stays separate from credentials and private state</text>
      </g>
      <g transform="translate(34 157)">
        <rect width="142" height="42" rx="21" fill="#122238" stroke="#3b82f6"/>
        <text x="71" y="27" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="750">PREFLIGHT</text>
        <line x1="154" y1="21" x2="194" y2="21" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="207" width="142" height="42" rx="21" fill="#10342f" stroke="#14b8a6"/>
        <text x="278" y="27" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="750">APPLY</text>
        <line x1="361" y1="21" x2="401" y2="21" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="414" width="124" height="42" rx="21" fill="#172e1d" stroke="#22c55e"/>
        <text x="476" y="27" text-anchor="middle" fill="#86efac" font-size="13" font-weight="750">AUDIT</text>
      </g>
      <text x="34" y="238" fill="#7891a6" font-size="11" font-weight="750" letter-spacing="1.3">RELAY PATH</text>
      <g transform="translate(34 256)" text-anchor="middle">
