          <rect width="106" height="62" rx="14" fill="#161d28" stroke="#475569"/>
          <text x="53" y="29" fill="#f8fafc" font-size="14" font-weight="700">Client</text>
          <text x="53" y="47" fill="#7891a6" font-size="10">private output</text>
        </g>
        <line x1="116" y1="31" x2="150" y2="31" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
        <g transform="translate(162 0)">
          <rect width="106" height="62" rx="14" fill="#10342f" stroke="#2dd4bf"/>
          <text x="53" y="29" fill="#ecfeff" font-size="14" font-weight="700">Entry-A</text>
          <text x="53" y="47" fill="#7dd3c7" font-size="10">Hysteria2</text>
        </g>
        <line x1="278" y1="31" x2="312" y2="31" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
        <g transform="translate(324 0)">
          <rect width="106" height="62" rx="14" fill="#2a1b42" stroke="#a78bfa"/>
          <text x="53" y="29" fill="#f3e8ff" font-size="14" font-weight="700">Relay-A</text>
          <text x="53" y="47" fill="#c4b5fd" font-size="10">WireGuard</text>
        </g>
        <line x1="440" y1="31" x2="474" y2="31" stroke="#64748b" stroke-width="3"/>
        <g transform="translate(486 0)">
          <rect width="52" height="62" rx="14" fill="#161d28" stroke="#475569"/>
          <text x="26" y="36" fill="#cbd5e1" font-size="11" font-weight="700">NET</text>
        </g>
      </g>
      <g transform="translate(34 346)">
        <rect width="538" height="100" rx="16" fill="#070b12" stroke="#263241"/>
        <text x="20" y="27" fill="#7891a6" font-size="11" font-weight="750" letter-spacing="1.2">SANITIZED RESULT</text>
        <circle cx="24" cy="59" r="7" fill="#22c55e"/>
        <text x="42" y="64" fill="#86efac" font-size="15" font-weight="700">audit: in sync</text>
        <text x="180" y="64" fill="#5eead4" font-size="15" font-weight="700">drift: none</text>
        <text x="20" y="86" fill="#7891a6" font-size="11">bounded evidence · secrets omitted · state remains local</text>
        <g transform="translate(388 18)">
          <rect width="62" height="26" rx="13" fill="#122238" stroke="#355676"/>
          <text x="31" y="18" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">Mihomo</text>
          <rect x="70" width="80" height="26" rx="13" fill="#2a1b42" stroke="#62448a"/>
          <text x="110" y="18" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="700">Shadowrocket</text>
        </g>
      </g>
      <g transform="translate(34 470)">
        <rect width="538" height="34" rx="17" fill="#0f766e" fill-opacity="0.2" stroke="#2dd4bf" stroke-opacity="0.5"/>
        <text x="269" y="22" text-anchor="middle" fill="#99f6e4" font-size="12" font-weight="700">SET UP · CHECK · CHANGE · RECOVER</text>
      </g>
    </g>
